name: lab

# Offline backtest lab (spec 12.5, rows AH to AR; PLT-019). Owner-approved protected path (row AQ).
# Not a merge gate: build-test, repo-checks and protected-paths stay the gates.
#
# Started by hand (workflow_dispatch). Stages are added part by part (WP40a: data; WP40b: single;
# WP40c: sweep, holdout); a stage that is not built yet is refused with a message.
# Data rule (row AI): the downloaded and converted data lives only in the Actions cache. It is never
# committed and never uploaded as an artifact; artifacts hold manifests, trade logs, run records and
# reports only.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to run'
        type: choice
        options: [data, single, sweep, holdout]
        default: data
      symbols:
        description: 'Symbols, comma-separated'
        type: string
        default: 'EURUSD,GBPUSD,USDJPY,AUDUSD,XAUUSD'
      from:
        description: 'First day of the download (first day of a month)'
        type: string
        default: '2019-03-01'
      to_month:
        description: 'Last month yyyy-mm (empty: the month before the current UTC month)'
        type: string
        default: ''
      grid:
        description: 'Grid file under lab/grids/ (sweep stage)'
        type: string
        default: ''
      selection:
        description: 'Selection file under lab/selection/ (holdout stage)'
        type: string
        default: ''
      shards:
        description: 'Number of sweep shards (1 to 20)'
        type: string
        default: '20'
      stress:
        description: 'Cost stress (12.1 step 6)'
        type: boolean
        default: false
      report_issue:
        description: 'Issue number to post the report to (empty: no comment)'
        type: string
        default: ''
  pull_request:
    paths:
      - 'lab/**'
      - 'src/ZoneFvg.Lab/**'
      - '.github/workflows/lab.yml'

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inputs:
    name: inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      symbols: ${{ steps.check.outputs.symbols }}
      to_month: ${{ steps.check.outputs.to_month }}
    steps:
      - name: Check the inputs
        id: check
        env:
          STAGE: ${{ inputs.stage }}
          SYMBOLS: ${{ inputs.symbols }}
          FROM: ${{ inputs.from }}
          TO_MONTH: ${{ inputs.to_month }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          case "$STAGE" in
            data) ;;
            single) echo "::error::Stage 'single' is not built yet (WP40b)."; exit 1 ;;
            sweep) echo "::error::Stage 'sweep' is not built yet (WP40c)."; exit 1 ;;
            holdout) echo "::error::Stage 'holdout' is not built yet (WP40c)."; exit 1 ;;
            *) echo "::error::Unknown stage '$STAGE'."; exit 1 ;;
          esac
          if ! [[ "$SHARDS" =~ ^[0-9]+$ ]] || [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 20 ]; then
            echo "::error::shards must be a whole number from 1 to 20, not '$SHARDS'."; exit 1
          fi
          if ! [[ "$FROM" =~ ^[0-9]{4}-[0-9]{2}-01$ ]]; then
            echo "::error::from must be the first day of a month (yyyy-mm-01), not '$FROM'."; exit 1
          fi
          if [ -z "$TO_MONTH" ]; then
            TO_MONTH="$(date -u -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
          fi
          if ! [[ "$TO_MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "::error::to_month must be yyyy-mm, not '$TO_MONTH'."; exit 1
          fi
          json="["
          sep=""
          IFS=',' read -ra list <<< "$SYMBOLS"
          for raw in "${list[@]}"; do
            s="$(echo "$raw" | tr -d '[:space:]')"
            case "$s" in
              EURUSD|GBPUSD|USDJPY|AUDUSD|XAUUSD) ;;
              *) echo "::error::Unknown symbol '$s'."; exit 1 ;;
            esac
            json="$json$sep\"$s\""
            sep=","
          done
          json="$json]"
          if [ "$json" = "[]" ]; then echo "::error::No symbol given."; exit 1; fi
          echo "stage=$STAGE symbols=$json from=$FROM to_month=$TO_MONTH"
          echo "symbols=$json" >> "$GITHUB_OUTPUT"
          echo "to_month=$TO_MONTH" >> "$GITHUB_OUTPUT"

  data:
    name: data (${{ matrix.symbol }})
    needs: inputs
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'data'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Dukascopy throttles bursts: requests at a time (at most 4) and the pause of each worker
      # after a request, in seconds.
      LAB_WORKERS: '4'
      LAB_PAUSE: '0'
    strategy:
      fail-fast: false
      matrix:
        symbol: ${{ fromJSON(needs.inputs.outputs.symbols) }}
    steps:
      - uses: actions/checkout@v7

      # Exact key: this symbol up to the last month. An older cache of the symbol is restored by the
      # prefix, and only the months it does not hold (or whose checksum differs) are downloaded.
      - name: Restore the data cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: lab-data/${{ matrix.symbol }}
          key: lab-m1-v1-${{ matrix.symbol }}-${{ needs.inputs.outputs.to_month }}
          restore-keys: |
            lab-m1-v1-${{ matrix.symbol }}-

      - name: Download and convert
        env:
          SYMBOL: ${{ matrix.symbol }}
          FROM: ${{ inputs.from }}
          TO_MONTH: ${{ needs.inputs.outputs.to_month }}
        run: >-
          python3 -I lab/data/dukascopy.py --symbols "$SYMBOL" --from "$FROM"
          --to-month "$TO_MONTH" --workers "$LAB_WORKERS" --pause "$LAB_PAUSE" --out lab-data

      - name: Save the data cache
        if: success() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: lab-data/${{ matrix.symbol }}
          key: lab-m1-v1-${{ matrix.symbol }}-${{ needs.inputs.outputs.to_month }}

      # A stopped download keeps its finished months (the symbol's manifest is rewritten after
      # every month); they are saved under a key of this run, which the restore prefix finds, so
      # the next run continues from there.
      - name: Save the finished months of a stopped download
        if: failure() && hashFiles(format('lab-data/{0}/manifest.csv', matrix.symbol)) != ''
        uses: actions/cache/save@v6
        with:
          path: lab-data/${{ matrix.symbol }}
          key: lab-m1-v1-${{ matrix.symbol }}-${{ needs.inputs.outputs.to_month }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      # Manifests only: never the data (row AI).
      - name: Upload the symbol's manifests
        uses: actions/upload-artifact@v7
        with:
          name: lab-data-manifest-${{ matrix.symbol }}
          path: |
            lab-data/${{ matrix.symbol }}/manifest.csv
            lab-data/${{ matrix.symbol }}/raw-manifest.csv
          if-no-files-found: error

  data-manifest:
    name: data-manifest
    needs: [inputs, data]
    if: github.event_name == 'workflow_dispatch' && inputs.stage == 'data'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Download the symbols' manifests
        uses: actions/download-artifact@v8
        with:
          pattern: lab-data-manifest-*
          path: parts

      - name: Merge the manifests
        env:
          SYMBOLS: ${{ inputs.symbols }}
        run: |
          set -euo pipefail
          for dir in parts/lab-data-manifest-*; do
            symbol="${dir##*-}"
            mkdir -p "lab-data/$symbol"
            cp "$dir/manifest.csv" "$dir/raw-manifest.csv" "lab-data/$symbol/"
          done
          python3 -I lab/data/dukascopy.py --symbols "$(echo "$SYMBOLS" | tr -d '[:space:]')" --merge-only --out lab-data | tee merge.log
          data_id="$(tail -n 1 merge.log)"
          echo "-----BEGIN LAB DATA MANIFEST-----"
          cat lab-data/manifest.csv
          echo "$data_id"
          echo "-----END LAB DATA MANIFEST-----"
          {
            echo "## Lab data"
            echo
            echo "\`$data_id\`"
            echo
            echo '```'
            cat lab-data/manifest.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the manifest
        uses: actions/upload-artifact@v7
        with:
          name: lab-data-manifest
          path: |
            lab-data/manifest.csv
            lab-data/raw-manifest.csv
          if-no-files-found: error

  lab-tests:
    name: lab-tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Python unit tests (lab/data, no network)
        working-directory: lab/data
        run: python3 -I -m unittest -v
