version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # The cTrader package must match the platform version in use. Update by hand.
      - dependency-name: cTrader.Automate
