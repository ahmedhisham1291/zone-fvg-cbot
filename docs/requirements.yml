  # ---------------------------------------------------------------- SIMULATION
  - id: SIM-001
    wp: WP10
    spec: "12.1"
    verify: unit
    status: implemented
    text: >-
      Trade log format. Backtests export one row per closed trade: symbol,
      zone id, open and close time (UTC), side, volume, entry, stop, target,
      exit price, exit reason, result in money and in R, commission, swap.

  - id: SIM-002
    wp: WP10
    spec: "12.1"
    verify: unit
    status: implemented
    text: >-
      Portfolio combiner. Merges per-symbol trade logs by time and reports
      combined equity curve, maximum drawdown and how often each account-level
      cap would have applied.

  - id: SIM-003
    wp: WP10
    spec: "12.1"
    verify: unit
    status: implemented
    text: >-
      Monte Carlo. Reshuffles trade order with a seeded generator and reports
      the distribution of maximum drawdown and of 30-trade average R,
      including the 1st and 5th percentiles used by spec 13.3.

  - id: SIM-004
    wp: WP10
    spec: "12.1, 15.2, 15.5"
    verify: unit
    status: implemented
    text: >-
      FTMO challenge simulator. Replays sampled trade sequences through the
      2-Step rules (profit target, daily loss from the 00:00 CE(S)T balance,
      static maximum loss, four trading days) at a given risk per trade and
      reports pass probability, breach probability and time to pass for the
      Challenge and Verification phases.

  - id: SIM-005
    wp: WP24
    spec: "13.1"
    verify: unit
    status: implemented
    text: >-
      Acceptance report. Produces every measure of spec 13.1 from trade logs
      and states pass or fail against each threshold. Changed on 2026-11-17
      (owner decision D): the profitable-symbols threshold is max(3, N - 1)
      of N, N being the number of symbols the run covers: every symbol in
      the development logs given to the tool, a log without any trade
      counting as one symbol that is not profitable (owner answer of
      2026-11-17). Development logs with no trade at all are refused. The
      threshold applies to both segments: 3 of 4 for the four forex pairs,
      4 of 5 with gold.

  - id: SIM-006
    wp: WP38
    spec: "4.1.1, 12.1"
    verify: unit
    status: implemented
    text: >-
      Recovery sizing in the challenge simulator (owner decisions U and Z of
      2026-11-24). The commands ftmo and accept accept --sizing recovery
      beside fixed and ladder, with --recovery-run-loss <percent> (default
      1.0), --recovery-max <percent> (default 1.28), --reward-risk <R>
      (default 2.0) and the growth of RSK-016 (1.5924, --growth <g>). Each
      trade then risks the amount of RSK-016 (owner decision Z) computed from
      the simulated initial capital and balance at its open and the
      positions, columns, freeze and eight-loss reset of its own symbol
      (owner decision V), replayed from the simulated opens and closes in the
      simulator's order, a win being a result above zero. A trade's
      money result is its ResultR times its risk. As for the ladder, only
      the two phases (10% and 5%) are run and the report names the sizing
      recovery. Any other --sizing value is refused with a message naming
      the three values. With the defaults and every trade of one symbol
      losing 1R from 200,000 the simulated risks are the eight base amounts
      of RSK-016, then 40.6027 again after the reset.

  - id: SIM-007
    wp: WP38
    spec: "12.1, 15"
    verify: unit
    status: implemented
    text: >-
      Simulation defaults for the 200,000 USD account (owner decisions P and
      R of 2026-11-24). The initial capital of the combiner, the challenge
      simulator and the acceptance report, and the --initial-capital option
      of every command, default to 200,000; the daily budget of the combiner
      and the challenge simulator, and the --daily-budget option, default to
      2.0. The combiner's open-risk cap and currency cap are off by default
      (owner decision W) and each is on exactly when its option
      (--max-open-risk, --max-per-currency) is given or its parameter object
      switches it on; the report then counts its refusals as before, and
      when it is off the report says so. The help text shows the new
      defaults. Given explicitly, the old values (100,000, 1.5 and both caps
