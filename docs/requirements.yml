  - id: LAB-009
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Grid file and sweep. A grid file under lab/grids/ names the rule
      (LAB-SEL-1), the symbols, the base file per symbol and one or more
      blocks of Key=v1|v2|... lists; each block is the full product of its
