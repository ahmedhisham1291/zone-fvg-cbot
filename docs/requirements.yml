# Numbered requirements extracted from docs/spec.md (v0.15).
#
# Rules for this file
# - The text of a requirement changes only in a pull request that carries the
#   label `human-approved-infra` (AGENTS.md, "Who merges"). The owner's money
#   decisions in it change only when the owner asks.
# - Implementing agents may change ONLY the `status:` line of the requirements
#   in their work package, from `planned` to `implemented`.
# - verify: unit      -> covered by xUnit tests tagged [Trait("Req", "<ID>")]
#           scenario  -> covered by FakeBroker scenario tests, same tag
#           build     -> proven by the CI build itself
#           manual    -> proven by a human test recorded in docs/test-records/
#           backtest  -> proven by a backtest report in docs/test-records/
# - CI (tools/check_traceability.py) fails when an `implemented` requirement
#   with verify unit/scenario has no tagged test.

version: 1
requirements:

  # ---------------------------------------------------------------- SIGNAL LAYER
  - id: SIG-001
    wp: WP01
    spec: "3, 9.4"
    verify: unit
    status: implemented
    text: >-
      The signal layer reads closed bars only. A bar is passed to the core
      exactly once, after it has closed. No API of the core accepts or exposes a
      forming bar.

  - id: SIG-002
    wp: WP03
    spec: "9.4"
    verify: unit
    status: implemented
    text: >-
      Determinism. Feeding the same bar sequence with the same parameters into
      a fresh SignalEngine always produces identical zones (ids, edges, states)
      and identical signals, bit for bit.

  - id: SIG-003
    wp: WP01
    spec: "3"
    verify: unit
    status: implemented
    text: >-
      Windowed indicators. ATR(14) is the arithmetic mean of the true range of
      the last 14 closed bars (true range uses the previous close; 15 bars are
      needed). EMA(n) is computed over exactly the last 4*n closed bars, seeded
      with the simple average of the first n bars of that window, then the
      standard recursion with alpha = 2/(n+1). Indicator values depend on no
      bars outside their window.

  - id: SIG-004
    wp: WP03
    spec: "3"
    verify: unit
    status: implemented
    text: >-
      Bar intake. Bars of each timeframe must arrive in strictly increasing
      open-time order; a duplicate or out-of-order bar is rejected with an
      error and does not change state. When bars of several timeframes close at
      the same instant they are processed in the order D1, H4, M15.

  - id: SIG-005
    wp: WP01
    spec: "3.1"
    verify: unit
    status: implemented
    text: >-
      Bias. Long when the last closed D1 close is above the D1 EMA(BiasEmaPeriod),
      Short when below, Neutral when equal or when the EMA window is not yet
      full. Bias is recomputed only when a D1 bar closes.

  - id: SIG-006
    wp: WP01
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Swings. A swing high is an H4 bar whose high is strictly greater than the
      highs of SwingStrength (3) bars on each side; it is confirmed only when
      the third bar to its right has closed. Swing lows mirror this. Only
      swings whose bar lies within the last 100 closed H4 bars are retained.

  - id: SIG-007
    wp: WP02
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Impulse leg. At each H4 close, the leg is the longest run of 1 to
      MaxImpulseBars (3) consecutive same-direction bars ending at the
      just-closed bar (bullish: close > open) whose net move
      |close(last) - open(first)| is at least ImpulseAtrMult x ATR(H4), where
      ATR is the value as of the bar immediately before the leg. A bar with
      close == open ends a run.

  - id: SIG-008
    wp: WP02
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Break of structure. A bullish leg qualifies only if its final close is
      above the most recent confirmed swing high whose bar is before the leg's
      first bar. No retained swing means no zone. RequireBos=false disables
      this check. Bearish legs mirror this with swing lows.

  - id: SIG-009
    wp: WP02
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Base. The base is the 1 to MaxBaseBars (3) bars immediately before the
      leg, collected backward while each bar's range (high - low) is at most
      1.0 x ATR(H4). The bar immediately before the leg is always included
      even if its range is larger.

  - id: SIG-010
    wp: WP02
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Zone edges. Demand: distal = lowest low of the base bars and the first
      leg bar; proximal = highest body top (max(open, close)) of the base bars.
      Supply: distal = highest high of the base bars and the first leg bar;
      proximal = lowest body bottom (min(open, close)) of the base bars. A zone
      whose proximal is not strictly on the trade side of its distal is
      discarded.

  - id: SIG-011
    wp: WP02
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Width check. A zone is kept only if |proximal - distal| is between
      MinZoneAtr (0.2) and MaxZoneAtr (1.5) x ATR(H4), inclusive, using the
      same ATR value as SIG-007.

  - id: SIG-012
    wp: WP02
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Supersede rule. A newly created zone removes every older zone of the
      same type that is still Active (never touched) and whose price range
      intersects the new zone by more than 50% of the OLDER zone's height.
      Zones in any other state are never removed by this rule.

  - id: SIG-013
    wp: WP02
    spec: "3.2"
    verify: unit
    status: implemented
    text: >-
      Activation and identity. A zone becomes Active at the open time of the H4
      bar following the leg's last bar. Its id is "D-yyyyMMdd-HHmm" (demand) or
      "S-yyyyMMdd-HHmm" (supply), built from the UTC open time of the first
      base bar. The same history always yields the same id.

  - id: SIG-014
    wp: WP03
    spec: "3.3"
    verify: unit
    status: implemented
    text: >-
      Zone lifecycle, evaluated at each M15 close using only M15 bars whose
      open time is at or after the activation time. Active -> Touched on the
      first bar with low <= proximal (demand). Touched -> Signalled when a
      valid FVG appears, then immediately Used. Touched -> Used when
      ConfirmWindowBars (16) bars have closed since the touch bar without a
      signal. Any state -> Invalid when a bar closes beyond distal (demand:
      close < distal). Any state -> Expired when MaxZoneAgeBars (120) H4 bars
      have closed since activation. Invalid, Used and Expired are terminal.

  - id: SIG-015
    wp: WP03
    spec: "3.1"
    verify: unit
    status: implemented
    text: >-
      Supply and demand zones are both detected and tracked regardless of
      bias. Bias only decides whether a zone may produce a signal.

  - id: SIG-016
    wp: WP03
    spec: "3.4"
    verify: unit
    status: implemented
    text: >-
      Bullish FVG. With c3, c2, c1 the three most recently closed M15 bars
      (c1 newest): low(c1) > high(c3); c2 closes above its open; gap height
      low(c1) - high(c3) is at least MinFvgAtr x ATR(M15); all three bars
      opened at or after the touch bar opened; c1 closes within
      ConfirmWindowBars of the touch bar; the gap's lower edge high(c3) is at
      most proximal + 0.5 x ATR(H4). Only the first FVG meeting all conditions
      after the touch is used. Bearish FVG mirrors this.

  - id: SIG-017
    wp: WP03
    spec: "3.5"
    verify: unit
    status: implemented
    text: >-
      Signal levels (buy). Entry = low(c1) - EntryLevelPct/100 x gap height.
      Stop = min(zone distal, lowest low since the touch bar inclusive)
      - StopBufferAtr x ATR(M15). Target = entry + RewardRisk x (entry - stop).
      Sell mirrors this. The signal carries zone id, levels, the three FVG bar
      times, the confirmation bar close time and the ATR(H4) used (added in
      WP06). The stop distance is abs(entry - stop); there is no separate
      field.

  - id: SIG-018
    wp: WP03
    spec: "3.3"
    verify: unit
    status: implemented
    text: >-
      A zone produces at most one signal. A signal is emitted only if bias
      matches the zone type (Long/demand, Short/supply) at the confirmation
      bar; otherwise the zone still moves to Used and no signal is emitted.

  - id: SIG-019
    wp: WP03
    spec: "8.3, 9.4"
    verify: unit
    status: implemented
    text: >-
      Replay equals live. For any time T, an engine that has processed the
      full history up to T and an engine started from any earlier point that
      satisfies the warm-up requirement hold identical non-terminal zones
      (ids, edges, states, touch data) and emit identical signals after T.

  - id: SIG-020
    wp: WP03
    spec: "8.3"
    verify: unit
    status: implemented
    text: >-
      Warm-up. The engine computes the minimum number of closed bars per
      timeframe it needs from its parameters and reports NotReady, emitting no
      zones or signals, until every timeframe has that many bars. With default
      parameters the requirement does not exceed 300 D1, 500 H4 and 3,000 M15
      bars.

  - id: SIG-021
    wp: WP03
    spec: "3"
    verify: unit
    status: implemented
    text: >-
      Mirror symmetry. Reflecting every price of a bar sequence around a
      constant (p -> K - p, swapping high and low) turns every demand zone
      into the corresponding supply zone and every buy signal into the
      corresponding sell signal, with reflected levels.

  # ---------------------------------------------------------------- RISK
  - id: RSK-001
    wp: WP04
    spec: "4.1"
    verify: unit
    status: implemented
    text: >-
      Position size. riskAmount = balance x RiskPercent/100; volume =
      riskAmount / (stopPips x pipValuePerUnit), rounded DOWN to the symbol's
      volume step. If the result is below the symbol's minimum volume the
      trade is skipped. Volume is never rounded up.

  - id: RSK-002
    wp: WP38
    spec: "4.3, 7"
    verify: unit
    status: implemented
    text: >-
      Sanity caps. A trade is skipped (reason logged, alert raised) if its
      volume exceeds MaxVolumeUnits, or its stop or target is on the wrong
      side of entry; these checks always apply. Changed on 2026-11-24
      (owner decision S): the check "computed risk above SanityCapPercent
      (default 0.55) of balance" applies only when SanityCapEnabled is true,
      and SanityCapEnabled defaults to false. When it is on, a computed risk
      exactly at the limit is allowed and one above it (beyond the 1e-9
      tolerance of PriceMath) is skipped with RiskAboveSanityCap, as
      before; the computed risk is that of the rounded volume. When it is
      off no trade is skipped for its risk percent by this check, and every
      other check of RSK-001, RSK-003 to RSK-006 and RSK-010 runs
      unchanged. The order of the checks is unchanged.

  - id: RSK-003
    wp: WP06
    spec: "4.1"
    verify: unit
    status: implemented
    text: >-
      Margin check. A trade is skipped if estimated free margin after the
      trade would be below 50% of equity. The margin estimate comes from the
      broker port.

  - id: RSK-004
    wp: WP38
    spec: "4.2, 7"
    verify: unit
    status: implemented
    text: >-
      Open risk cap. When OpenRiskCapEnabled is true, the sum of risk at stop
      of every bot position and pending order on the account, plus the new
      trade, must not exceed MaxOpenRiskPercent (1.5%) of InitialCapital.
      Changed on 2026-11-24 (owner decision W): OpenRiskCapEnabled defaults
      to false, and then this check refuses nothing; the open risk is still
      computed and reported wherever it is reported today.

  - id: RSK-005
    wp: WP38
    spec: "4.2, 7"
    verify: unit
    status: implemented
    text: >-
      Currency exposure cap, when CurrencyCapEnabled is true (default false
      from 2026-11-24, owner decision W; when false this check refuses
      nothing). Buying a pair is long its base and short its
      quote currency. For each of the two currencies of the new trade, on the
      side the new trade takes in it, the number of bot positions and pending
      orders on that side, including the new trade, must not exceed
      MaxPositionsPerCurrency (2). Currencies the new trade does not touch are
      not checked.

  - id: RSK-006
    wp: WP38
    spec: "4.2, 15.4"
    verify: unit
    status: implemented
    text: >-
      Daily risk budget. Let M be the balance at 00:00 CE(S)T of the current
      day and W the worst-case equity if every open bot position and pending
      order, including the new trade, were closed at its stop. A new trade is
      allowed only if M - W <= DailyLossLimitPercent (2%; 1.5% until the
      owner decision R of 2026-11-24) of InitialCapital, in both sizing plans.
      When the budget is exhausted, pending entry orders are cancelled and no
      entries are allowed until the next CE(S)T day.

  - id: RSK-007
    wp: WP04
    spec: "4.2"
    verify: unit
    status: implemented
    text: >-
      Stateless day start. The balance at 00:00 CE(S)T is reconstructed as
      current balance minus the net result (profit, commission, swap) of all
      account trades closed since that moment, from broker history. No stored
      value is used.

  - id: RSK-008
    wp: WP07
    spec: "4.2"
    verify: unit
    status: implemented
    text: >-
      Kill switch. Peak = highest end-of-trade balance since RiskEpochDate,
      from history, and not less than the balance at RiskEpochDate. If
      (Peak - equity) / Peak >= MaxDrawdownPercent (8%) the bot enters Halted.
      Recomputing after a restart yields the same decision.

  - id: RSK-009
    wp: WP38
    spec: "4.2, 15.4"
    verify: unit
    status: implemented
    text: >-
      FTMO emergency guard. If equity <= M - (FtmoDailyLossPercent -
      FtmoGuardBufferPercent)% of InitialCapital, or equity <= InitialCapital x
      (1 - (FtmoMaxLossPercent - FtmoGuardBufferPercent)/100), the decision is
      CloseAllAndHalt. With defaults: M - 8,000 and 182,000 on 200,000
      (owner decision P of 2026-11-24; M - 4,000 and 91,000 on 100,000
      before). If M
      cannot be computed because broker data is missing or invalid, the guard
      still applies the second condition from equity and InitialCapital alone.

  - id: RSK-010
    wp: WP07
    spec: "4.3"
    verify: unit
    status: implemented
    text: >-
      Circuit breakers. Entries per symbol per CE(S)T day <= 2 and per account
      per day <= 6, counted from broker history and open orders. Order
      requests per instance <= 20 per hour and <= MaxRequestsPerDay (100) per
      day; unhandled errors <= 5 per hour. Exceeding a request or error limit
      halts the instance. A request that would exceed a request limit is
      never sent: the check runs before the request.

  - id: RSK-011
    wp: WP04
    spec: "4.2, 8.1"
    verify: unit
    status: implemented
    text: >-
      Every risk decision is a pure function of an explicit input snapshot
      (account, positions, pending orders, history, symbol data, time,
      parameters). The risk module holds no mutable state between calls,
      except the in-memory request and error counters of RSK-010.

  - id: RSK-012
    wp: WP04
    spec: "4.2"
    verify: unit
    status: implemented
    text: >-
      CE(S)T day boundary. Central European time is UTC+1, or UTC+2 from
      01:00 UTC on the last Sunday of March until 01:00 UTC on the last Sunday
      of October. The conversion is implemented in the core without using
      operating-system time-zone data, and is correct on the changeover days.

  - id: RSK-013
    wp: WP18
    spec: "4.1"
    verify: unit
    status: implemented
    text: >-
      Ladder sizing (owner's plan of 2026-11-16, step rule of 2026-11-17).
      Entries are numbered 1, 2, 3 in the order their entry orders were
      placed, counting every bot entry order since RiskEpochDate that filled
      or is still pending; orders that were cancelled or expired unfilled are
      not counted. A win is a closed bot trade with a net result above zero;
      losses and break-even trades are not wins. A close at the same instant
      as a placement counts as before it.
      (1) Position: the position p(t) of entry t is 1 plus the number of
      entries placed after the latest win that closed before entry t was
      placed (or since entry 1 if there is none).
      (2) Columns: there are four step columns C, D, E, F for positions 1 to
      4, each holding a whole number, all 0 at the start. Entry t starts deal
      t of size LadderDealRiskPercent (0.30) x LadderGrowth (1.5924) ^ step,
      where step is the value of the column of p(t) when entry t is placed,
      or 0 when p(t) is 5 or more.
      (3) Parts: deal t is split into four parts traded on entries t, t+1,
      t+2, t+3 with the weights w1 = 0.2962, w2 = w1/2, w3 = (w1+w2)/2,
      w4 = (w1+w2+w3)/2. A win ends every open deal: deal j gives nothing to
      entry t when a win closed after entry j was placed and before entry t
      was placed. The raw percent of entry t is the sum of the parts of deals
      t, t-1, t-2 and t-3 that fall on it and have not ended; the risk
      percent is the raw percent capped at MaxRiskPercentPerTrade (0.5).
      (4) Raising a step: when a win closes, the column of the winning
      entry's position (F for position 5 or more) is raised by 1, except that
      while the column before it is 0 the raise moves one column back (a win
      at position 4 with D = 1 and E = 0 raises E; with D = 0 and E = 0 it
      raises D; C is always allowed).
      (5) Freeze and reset: once an entry's raw percent is above
      MaxRiskPercentPerTrade, wins that close after that entry was placed
      raise no step. The columns go back to 0 and raising is allowed again
      only through a new RiskEpochDate (the owner sets it after a payout or
      for a new account); entries before RiskEpochDate are not counted.
      There is no monthly reset.
      Everything is computed from broker data, so a restart gives the same
      percent. All other risk limits still apply after it. With
      LadderEnabled false, the fixed RiskPercent is used.

  - id: RSK-014
    wp: WP22
    spec: "4.2, 7"
    verify: unit
    status: implemented
    text: >-
      Start checks (fail closed; owner acceptance of 2026-11-17). Before its
      first recovery the bot refuses to start, with a Log line that names
      both values, when (1) 00:00 CE(S)T of RiskEpochDate is later than the
      broker's server time, or (2) in a backtest, the account balance
      differs from InitialCapital by more than 0.01 in account currency. A
      RiskEpochDate whose start equals the server time, and a difference of
      exactly 0.01, are accepted. Outside backtests the balance is not
      compared with InitialCapital. If the account or the server time cannot
      be read, the bot refuses to start.

  - id: RSK-015
    wp: WP24
    spec: "2, 4.2"
    verify: unit
    status: implemented
    text: >-
      Gold in the currency cap (owner decision D of 2026-11-17). XAUUSD is
      handled by RSK-005 like a pair with base XAU and quote USD: a gold buy
      counts as long XAU and short USD, a gold sell as short XAU and long
      USD, so gold counts towards the USD limit together with the forex
      pairs. The base and quote come from the broker's symbol data, as for
      the forex pairs.

  # ---------------------------------------------------------------- SIZING PLANS (spec v0.12, owner decisions of 2026-11-24)
  - id: RSK-016
    wp: WP38
    spec: "4.1, 4.1.1, 7"
    verify: unit
    status: implemented
    text: >-
      Recovery sizing amount with step columns (owner decision Z of
      2026-11-24, which replaces the rule of decision Q; per symbol, decision
      V). With SizingPlan Recovery, let RR be the instance's RewardRisk
      (2.0), m1 = 1 and mk = (m1 + ... + m(k-1) + RR) / RR for k = 2 to 8, M
      = m1 + ... + m8 (49.2578125 at RR = 2), F0 = InitialCapital x
      RecoveryRunLossPercent (1.0) / 100 / M and Bp = mp x F0. The risk money
      of an entry at position p (RSK-017) is R = min(Bp x LadderGrowth
      (1.5924) ^ step(p), balance x RecoveryMaxRiskPercent (1.28) / 100), with
      step(p) the value of the column of p (C, D, E, F, G, H, I, J for p = 1
      to 8) when the entry is placed and the balance from the broker port at
      placement. On 200,000 with all steps 0 the eight base amounts are
      40.6027, 60.9040, 91.3561, 137.0341, 205.5511, 308.3267, 462.4901 and
      693.7351, together 2,000. Columns are whole numbers, all 0 at
      RiskEpochDate. When a win of the symbol closes, the column of the
      winning entry's position is raised by 1, except that while the column
      before it is 0 the raise moves one column back (C is always allowed),
      as in RSK-013 clause 4. When the symbol's eighth non-win in a row
      (since its latest win or latest reset) closes, all its columns go back
      to 0 and the next entry is position 1. Freeze (proposal kept from the
      earlier plan): once an entry's raw amount is above RecoveryMaxRiskPercent
      x InitialCapital (a fixed reference, so no other symbol's result can
      change it; decision of 2026-11-24), wins of the
      symbol that close after that entry was placed raise no step, until the
      next eight-loss reset or a new RiskEpochDate; a raw amount exactly at
      the cap is not above it. The power is computed by repeated
      multiplication, as in the ladder. R is passed to the position sizer as
      the risk amount of RSK-001, not rounded before sizing, and every check
      of RSK-002 to RSK-006 and RSK-010 applies after it. SizingPlan Recovery
      uses LadderGrowth and none of LadderEnabled, RiskPercent,
      LadderDealRiskPercent, LadderFirstWeight and MaxRiskPercentPerTrade.

  - id: RSK-017
    wp: WP38
    spec: "4.1.1, 8.1"
    verify: unit
    status: implemented
    text: >-
      Recovery positions and columns from broker data (owner decisions V and
      Z of 2026-11-24, with the conventions of RSK-013). Entries are built
      from broker data as the ladder builds its entries, restricted to the
      instance's symbol: only bot positions, pending orders and closed
      trades whose symbol equals the instance's symbol (ordinal) are read,
      so other symbols never change a position, a column or R. Everything
      with the same bot label is one entry, placed at the earliest of its
      times; it is closed when nothing of it is open or pending, its net
      result is the sum of its closed parts (profit, commission, swap) and
      its close time the latest of them; entries placed before 00:00 CE(S)T
      of RiskEpochDate are not counted; cancelled or expired orders are not
      in the data and never count. A win is a closed entry with a net result
      above zero (1e-9 tolerance); every other closed entry, break-even
      included, is a non-win. Events are replayed by time; at the same
      instant closes of earlier-placed entries come before placements,
      closes among themselves and placements among themselves in entry order
      (placement time, then label, ordinal), and a close at the instant of
      its own placement right after that placement. The position of a new
      entry placed at server time T is 1 plus the number of the symbol's
      entries placed after the latest win close or reset (whichever is
      later) and at or before T, at most 8 (a ninth uses position 8,
      proposal). The amount is a pure function of the positions, pending
      orders and history read from the broker at the placement, the
      parameters and T: the same data in any record order, and the same
      data after a restart, give the same R, bit for bit. The ladder
      (RSK-013) is not changed and stays account-wide. A record with a time
      that is not UTC, a result that is not finite, an event after T, or
      history that cannot be read fails closed: no order is placed and the
      skip reason is BrokerDataInvalid, as for the ladder.

  - id: RSK-018
    wp: WP38
    spec: "4.1, 4.2, 4.3, 7, 15"
    verify: unit
    status: implemented
    text: >-
      Risk defaults for the 200,000 USD account (owner decisions P to Z of
      2026-11-24). The core's risk parameters default to InitialCapital
      200,000, DailyLossLimitPercent 2.0, SizingPlan Ladder,
      RecoveryRunLossPercent 1.0 (owner decision Z; it replaces
      RecoveryFirstRiskUsd, which is not a parameter any more),
      RecoveryMaxRiskPercent 1.28, SanityCapEnabled false, SanityCapPercent 0.55, OpenRiskCapEnabled false,
      CurrencyCapEnabled false and MaxVolumeUnits 3,000,000 (owner decisions
      W and X); every other default is unchanged (RiskPercent 0.5,
      MaxOpenRiskPercent 1.5, MaxPositionsPerCurrency 2, MaxDrawdownPercent 8,
      the FTMO values 5, 10 and 1, the ladder values).
      Validation refuses, naming the parameter, a SizingPlan other than
      Ladder or Recovery, and a RecoveryRunLossPercent,
      RecoveryMaxRiskPercent or SanityCapPercent that is not greater than 0
      and at most 100. With SizingPlan Ladder every
      sizing decision, journal line and the parameter hash are exactly as
      before this change, for the same parameters and broker data.

  # ---------------------------------------------------------------- NEWS
  - id: RSK-019
    wp: WP41
    spec: "4.1, 7"
    verify: unit
    status: implemented
    text: >-
      Drawdown brake (owner request of 2026-11-27, rows AU and AV). The
      core's risk parameters gain DrawdownBrakePercent (core default 0 = off,
      so every existing decision is unchanged) and DrawdownBrakeFactor (core
      default 0.5). Validation refuses, naming the parameter, a
      DrawdownBrakePercent that is not finite, below 0, or not below
      MaxDrawdownPercent, and a DrawdownBrakeFactor that is not finite, not
      greater than 0, or greater than 1. Only with SizingPlan Ladder and
      LadderEnabled false: for each new trade the peak is computed as for
      the kill switch (RSK-008, the same epoch and history); when
      DrawdownBrakePercent is above 0 and peak minus Account.Balance is at
      least peak x DrawdownBrakePercent / 100 (PriceMath tolerance, equal
      counts as braked), the trade's risk percent is RiskPercent x
      DrawdownBrakeFactor, otherwise RiskPercent. A peak that is not
      positive leaves the decision to the kill switch, which halts (fail
      closed); the brake never raises risk. Nothing is stored between
      trades. The ladder (RSK-013) and Recovery (RSK-014 onward) ignore the
      brake. Every later check (daily budget, kill switch, floors, caps,
      sanity cap, MaxVolumeUnits) runs unchanged on the braked amount; the
      open-risk sum keeps counting balance x RiskPercent. When the brake
      sets the risk, the sizing note in the journal line of the trade says
      so with the peak, the balance and the two percents (format in the work
      package); otherwise every journal line is unchanged byte for byte.

  - id: RSK-020
    wp: WP44
    spec: "4.2, 7"
    verify: unit
    status: implemented
    text: >-
      Monthly loss limit (owner request of 2026-11-27, row BF). The core's
      risk parameters gain MonthlyLossLimitPercent (core default 0 = off, so
      every existing decision is unchanged); validation refuses, naming it, a
      value not finite, below 0, or not below MaxDrawdownPercent. With a
      value above 0: S = the balance at 00:00 CE(S)T on the first day of the
      current CE(S)T calendar month, rebuilt as current balance minus the
      net result (profit, commission, swap) of every account trade closed
      since then, from broker history (as RSK-007; nothing stored). When S
      minus Account.Balance is at least MonthlyLossLimitPercent / 100 x
      InitialCapital (PriceMath tolerance; equal counts), a new entry is
      refused with its own skip reason, pending bot entry orders are
      cancelled as when the daily budget is exhausted (RSK-006), and open
      positions are not touched; from 00:00 CE(S)T on the first day of the
      next month entries are allowed again. It counts every closed trade of
      the account (both gold instances), in every sizing plan and mode. A
      history read error refuses the entry (BrokerDataInvalid, fail closed).
      The cBot declares MonthlyLossLimitPercent with default 2.0 in the Risk
      group and passes it to the core; the parameter files carry
      MonthlyLossLimitPercent=2.0; the start line is unchanged; the guides
      describe the limit.

  - id: NWS-001
    wp: WP05
    spec: "6.1"
    verify: unit
    status: implemented
    text: >-
      News windows. For a symbol, relevant currencies are its base and quote.
      A window spans NewsBeforeMin (30) minutes before to NewsAfterMin (30)
      minutes after each high-impact event of a relevant currency. An event
      whose currency is "All" is relevant to every symbol. Overlapping windows
      merge.

  - id: NWS-002
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      Merge rule. An event is high impact if either feed rates it high. Events
      from the two feeds with the same currency and times within 5 minutes are
      treated as one event for logging and impact, but every event keeps its
      own window: merging never shortens the time in which entries are
      blocked.

  - id: NWS-003
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      Forex Factory parser. Parses the weekly JSON export (title, country as
      currency code, date as ISO 8601 with offset, impact) into events in UTC.
      Unknown impact values are kept as non-high. A document that is not valid
      JSON, is an HTML error page, or contains no events fails validation.

  - id: NWS-004
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      Single source. NewsSources accepts only ForexFactory (the default). Any
      other value stops the bot at start with a clear message, the same way a
      malformed ExtraBlackouts entry does. The ShowMyTrades parser is deferred
      by the owner's decision of 2026-11-14 and is added only with a real
      sample of the feed.
  - id: NWS-005
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      A download is accepted only if it parses, contains at least one event
      and covers the current time (Forex Factory: the current week). A
      document with any malformed event is rejected as a whole and raises an
      alert. A rejected download never replaces previously accepted data.

  - id: NWS-006
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      Refresh policy. Each source is fetched at start and every
      NewsRefreshHours (4), and never more often than once per 60 minutes.
      While a source has no accepted data covering the current time (after a
      failed or rejected fetch, or when the week has rolled over), it is
      fetched again as soon as 60 minutes have passed since the last attempt.
      The time of the last attempt is persisted through the key-value port so
      that restarts cannot cause extra fetches.

  - id: NWS-007
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      Cache. The last accepted data of each source is stored with its fetch
      time through the key-value port and reloaded at start. Cached data older
      than NewsMaxCacheHours (48) without a successful refresh is not trusted.

  - id: NWS-008
    wp: WP05
    spec: "6.3"
    verify: unit
    status: implemented
    text: >-
      Fail-safe. If no source has trusted data covering the current time, the
      calendar status is Unavailable; with NewsFailMode=Block no entries are
      allowed and one alert is raised per outage.

  - id: NWS-009
    wp: WP05
    spec: "6.1"
    verify: unit
    status: implemented
    text: >-
      A signal is skipped if the current time is inside a news window of its
      symbol, or if any of its three FVG bars overlaps one.

  - id: NWS-010
    wp: WP05
    spec: "6.2, 6.4"
    verify: unit
    status: implemented
    text: >-
      Backtest provider. In backtests events come only from the embedded
      history provider; no network call is made. The embedded data format is
      one event per line: UTC time, currency, impact, title.

  - id: NWS-011
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      ExtraBlackouts. The parameter accepts a semicolon-separated list of
      "yyyy-MM-dd HH:mm CUR" entries in UTC, each treated as a high-impact
      event. A malformed entry stops the bot at start with a clear message.

  - id: NWS-012
    wp: WP05
    spec: "6.2"
    verify: unit
    status: implemented
    text: >-
      Events without a clock time (all-day, tentative, holidays) create no
      window and are listed in the log.

  - id: NWS-013
    wp: WP24
    spec: "6.1"
    verify: unit
    status: implemented
    text: >-
      Gold news (owner decision D of 2026-11-17). For XAUUSD the relevant
      currencies of NWS-001 are XAU and USD. No feed and no embedded history
      publishes XAU events, so gold is blocked by high-impact USD events,
      by "All" events and by ExtraBlackouts entries for USD or XAU, and is
      not blocked by EUR, GBP, JPY or AUD events. Windows, FVG overlap and
      order expiry (NWS-009, EXE-015) work as for the forex pairs.

  # ---------------------------------------------------------------- EXECUTION
  - id: EXE-001
    wp: WP06
    spec: "3.6, 8.1"
    verify: scenario
    status: implemented
    text: >-
      Freshness. A signal may be executed only if its confirmation bar closed
      at most one M15 bar ago and it was produced in live mode. Signals
      produced during replay are never executed.

  - id: EXE-002
    wp: WP06
    spec: "5.1"
    verify: scenario
    status: implemented
    text: >-
      Pre-trade filters. An order is placed only if: time is within
      SessionStartUtc..SessionEndUtc; on Fridays before FridayNoEntryUtc;
      spread <= MaxSpreadPips; the market is open; no bot position or pending
      order exists on the symbol; bot state is Running.

  - id: EXE-003
    wp: WP06
    spec: "3.6"
    verify: scenario
    status: implemented
    text: >-
      Stop bounds. A signal is skipped if its stop distance is below
      MinStopPips (12) or above MaxStopAtr (2.0) x ATR(H4), where ATR(H4) is
      the value carried by the signal.

  - id: EXE-004
    wp: WP06
    spec: "3.6"
    verify: scenario
    status: implemented
    text: >-
      Cost check. A signal is skipped if (spread + round-trip commission
      expressed in pips) exceeds CostToRiskMax (10%) of the stop distance.

  - id: EXE-005
    wp: WP06
    spec: "3.4, 3.6"
    verify: scenario
    status: implemented
    text: >-
      A signal is skipped if its FVG height is below MinFvgSpreadMult (3) x
      the current spread.

  - id: EXE-006
    wp: WP06
    spec: "3.6"
    verify: scenario
    status: implemented
    text: >-
      Room check. A buy signal is skipped if the proximal line of any
      non-terminal supply zone lies between entry and entry + MinRoomR (1.5) x
      stop distance. Sell mirrors this.

  - id: EXE-007
    wp: WP06
    spec: "3.5"
    verify: scenario
    status: implemented
    text: >-
      For sell orders the current spread is added to the stop distance before
      sizing and placement.

  - id: EXE-008
    wp: WP06
    spec: "5.2"
    verify: scenario
    status: implemented
    text: >-
      Order format. Entries are limit orders with stop loss, take profit and
      expiry attached at placement. Label = "ZFVG|v1|<symbol>|<zoneId>".
      Comment encodes entry, stop, target, risk amount and an 8-character
      parameter hash in a compact parseable form of at most 100 characters.

  - id: EXE-009
    wp: WP06
    spec: "5.3"
    verify: scenario
    status: implemented
    text: >-
      Idempotent placement. Before sending, the broker is queried for any
      order or position with the zone's label; if one exists nothing is sent.
      A clear rejection is never retried. An unclear outcome (timeout,
      disconnect, technical error) is never resent blindly: at the next bar
      the broker is queried again and the order is resent only if nothing
      exists, the signal is still fresh and price has not traded through the
      entry.

  - id: EXE-010
    wp: WP06
    spec: "5.3"
    verify: scenario
    status: implemented
    text: >-
      After a successful placement the order is read back and its stop,
      target and expiry are compared with the request; a mismatch cancels the
      order and raises an alert.

  - id: EXE-011
    wp: WP06
    spec: "5.4"
    verify: scenario
    status: implemented
    text: >-
      Post-fill protection. Every bot position must have a stop loss. A
      position found without one gets it set from its comment data; after two
      failed attempts the position is closed and an alert is raised. While any
      bot position has no stop loss, no new entry order is placed.

  - id: EXE-012
    wp: WP06
    spec: "5.4"
    verify: scenario
    status: implemented
    text: >-
      A partial fill is managed as a normal position. The unfilled remainder
      is left to expire.

  - id: EXE-013
    wp: WP06
    spec: "5.5"
    verify: scenario
    status: implemented
    text: >-
      Friday close. At or after FridayCloseUtc on a Friday all bot positions
      on the symbol are closed and pending entry orders cancelled.

  - id: EXE-014
    wp: WP06
    spec: "3.6"
    verify: scenario
    status: implemented
    text: >-
      Every skipped signal is recorded with exactly one reason code from a
      closed enumeration, plus the measured values behind the decision.

  - id: EXE-015
    wp: WP06
    spec: "6.1"
    verify: scenario
    status: implemented
    text: >-
      Order expiry is the earlier of the normal expiry (EntryExpiryBars after
      placement) and the start of the next news window for the symbol. If
      fewer than 15 minutes remain the signal is skipped.

  - id: EXE-016
    wp: WP22
    spec: "5.5, 8.3"
    verify: scenario
    status: implemented
    text: >-
      Friday close against a closed market (owner acceptance of
      2026-11-17). When Friday close (EXE-013) is due and the broker reports
      the symbol's market closed, no close or cancel request is sent. The
      weekend close is marked pending instead and is done at the first
      event at which the broker reports the market open again, as for a
      restart over the weekend (architecture section 10, 2026-11-16). With
      the market open, EXE-013 is unchanged.

  - id: EXE-017
    wp: WP22
    spec: "5.2, 5.3"
    verify: scenario
    status: implemented
    text: >-
      Price grid from the broker (owner acceptance of 2026-11-17). Entry,
      stop and target are rounded, half away from zero, to a whole multiple
      of the symbol's tick size and written in the order comment with the
      symbol's number of digits; both values come from the broker port
      (cTrader Symbol.TickSize and Symbol.Digits). The read-back check of
      EXE-010 compares stop and target within half a tick. Digits must be 0
      to 10, and the tick size finite, above zero and a whole multiple of
      10^-Digits (within 1e-9 of that step); otherwise the signal is skipped
      as BrokerDataInvalid and no order is sent. For the forex pairs
      (EURUSD 5 digits, tick 0.00001; USDJPY 3 digits, tick 0.001) the
      prices are the same as before.

  # ---------------------------------------------------------------- RECOVERY
  - id: REC-001
    wp: WP07
    spec: "8.5"
    verify: scenario
    status: implemented
    text: >-
      Bot states are Recovering, Running, Blocked and Halted with the
      transitions of spec 8.5. New orders are possible only in Running.

  - id: REC-002
    wp: WP07
    spec: "8.1, 8.4"
    verify: scenario
    status: implemented
    text: >-
      The same recovery procedure runs at start and after every reconnect, and
      it is safe to run it repeatedly.

  - id: REC-003
    wp: WP23
    spec: "8.3, 8.4"
    verify: scenario
    status: implemented
    text: >-
      Recovery waits for connection and bar history (rules of 2026-11-16
      changed by owner decision A of 2026-11-17). For each series (D1, H4,
      M15) it reads the closed bars; if the series has any problem it asks
      for more history once for that timeframe and reads again. Recovery
      then fails, stays in Recovering and alerts once per outage, only when
      the broker is not connected or a series still has fewer bars than the
      warm-up requirement, a missing bar entry, a bar not yet closed at
      server time, open times that are not strictly increasing, or a last
      bar that is not recent (at least two bar lengths of open-market time
      since its close: stale data). A gap is at least one bar length of
      open-market time between two consecutive bars; the weekend closure
      (Friday FridayCloseUtc to Monday 00:00 UTC), market holidays (whole
      UTC day) and, from REC-016, time outside the symbol's trading sessions
      count as closed. A gap that is still present after the reload is the
      broker's data and is accepted: recovery continues, writes one journal
      line per timeframe with accepted gaps, and its report gives the number
      of accepted gaps per timeframe and the three newest with both bar open
      times. A gap between two bars fed live blocks entries (Blocked, data
      gap) until the next recovery, which runs at the next timer event,
      reloads the history and accepts the gap if it is still there.

  - id: REC-004
    wp: WP07
    spec: "8.3"
    verify: scenario
    status: implemented
    text: >-
      Recovery rebuilds the signal layer by replaying stored bars with trading
      disabled. Signals produced during replay are recorded as not executable.

  - id: REC-005
    wp: WP07
    spec: "8.3"
    verify: scenario
    status: implemented
    text: >-
      Bot positions found at the broker are adopted by label: matched to
      their zone, plan read from the comment, stop loss and take profit
      verified and repaired per EXE-011.

  - id: REC-006
    wp: WP07
    spec: "8.3"
    verify: scenario
    status: implemented
    text: >-
      A pending bot order found at the broker is kept only if it has a stop,
      a target and an expiry and its zone is known and not Invalid; otherwise
      it is cancelled.

  - id: REC-007
    wp: WP07
    spec: "8.3"
    verify: scenario
    status: implemented
    text: >-
      A labelled position whose zone is unknown is kept with its existing
      stop and target, counted in all risk totals, included in Friday close,
      and reported.

  - id: REC-008
    wp: WP07
    spec: "8.3"
    verify: scenario
    status: implemented
    text: >-
      Trades that opened or closed while the bot was away are added to the
      journal from broker history, exactly once.

  - id: REC-009
    wp: WP07
    spec: "8.3"
    verify: scenario
    status: implemented
    text: >-
      Catch-up duties. If recovery finishes after Friday close with bot
      positions open they are closed immediately; if a risk limit is breached
      pending orders are cancelled.

  - id: REC-010
    wp: WP07
    spec: "8.3"
    verify: scenario
    status: implemented
    text: >-
      Each recovery produces a report (downtime, positions adopted, orders
      kept and cancelled, strangers, active zones, state entered) that is
      journaled and sent as an alert.

  - id: REC-011
    wp: WP07
    spec: "8.5"
    verify: scenario
    status: implemented
    text: >-
      The bot never stops its own process. Every event handler catches
      exceptions, journals them and increments the error counter of RSK-010.

  - id: REC-012
    wp: WP07
    spec: "8.4"
    verify: scenario
    status: implemented
    text: >-
      All time used for decisions comes from the broker port's server time or
      from bar times. The machine clock is never read.

  - id: REC-013
    wp: WP07
    spec: "5.3, 12.3"
    verify: scenario
    status: implemented
    text: >-
      Fault scenarios 1 to 11, 13 and 14 of spec 12.3 pass as automated
      FakeBroker scenarios with zero duplicate orders and zero positions left
      without a stop loss.

  - id: REC-014
    wp: WP23
    spec: "8.5, 12.1"
    verify: scenario
    status: implemented
    text: >-
      Backtest halts are recorded, not applied (owner decision C of
      2026-11-17). In a backtest, and never live, the kill switch (RSK-008),
      the FTMO emergency guard (RSK-009), the error limit and the request
      limits (RSK-010) do not put the bot into Halted, close positions,
      cancel orders or stop a request from being sent, and the daily risk
      budget (RSK-006, both the Blocked state with its order cancels and the
      budget check of a new trade) does not block or refuse anything.
      Instead the journal line "risk event=would-halt cause=<cause>
      detail=<text>" ("event=would-block cause=DailyBudget" for the budget)
      is written the first time each cause fires in a CE(S)T day, and
      trading continues, so the backtest trade list is complete and the
      simulation tools apply the account limits and FTMO's rules afterwards
      (spec 12.1). All other checks of a new trade (RSK-001 to RSK-005,
      RSK-010 entry counts, EXE filters) refuse trades as before. The mode
      is automatic: the adapter switches it on exactly when the cTrader
      running mode is not RealTime, there is no cBot parameter, and the core
      refuses to start with it on outside a backtest. Live behaviour is
      unchanged.

  - id: REC-015
    wp: WP23
    spec: "8.5, 5.5, 4.2"
    verify: scenario
    status: implemented
    text: >-
      Duties in every connected state (owner decision B of 2026-11-17).
      While the broker is connected, the FTMO emergency guard (RSK-009) is
      checked and Friday close (EXE-013, EXE-016) runs on every one-minute
      timer event in every state, Recovering included, and a pending weekend
      close (REC-009) is done at timer and trade events in every state. These
      duties read only broker data and do not need the signal engine. When
      the guard fires during Recovering, all bot trades are closed and the
      bot enters Halted (in a backtest REC-014 applies instead); the halt
      stays when recovery completes. Recovery still has to complete before
      the bot can leave Recovering for Running or Blocked. While
      disconnected no request is sent.

  - id: REC-016
    wp: WP24
    spec: "8.3, 8.4"
    verify: unit
    status: planned
    text: >-
      Symbol trading sessions in the market model (owner decision D of
      2026-11-17). The open-market time used for gaps and recency (REC-003)
      also counts as closed every moment outside the symbol's weekly trading
      sessions reported by the broker (cTrader Symbol.MarketHours.Sessions),
      for example gold's daily break. Sessions only add closed time to the
      weekend closure and market holidays; they never make a closed moment
      open. When the broker reports no session, the model is the weekend
      closure and holidays alone, and the start log says so. The sessions
      are read from the broker port each time they are needed and are never
      stored.

  # ---------------------------------------------------------------- OPERATIONS
  - id: OPS-001
    wp: WP09
    spec: "11"
    verify: unit
    status: implemented
    text: >-
      Signal journal. Every signal, taken or skipped, is journaled with the
      fields listed in spec section 11.

  - id: OPS-002
    wp: WP09
    spec: "11"
    verify: unit
    status: implemented
    text: >-
      Trade journal. Every closed trade is journaled with the fields listed
      in spec section 11, including result in R computed from the planned risk
      in the order comment.

  - id: OPS-003
    wp: WP09
    spec: "11, 15.4"
    verify: unit
    status: implemented
    text: >-
      Daily summary once per CE(S)T day with trades, net R, balance, equity,
      drawdown, distance to both FTMO floors, progress to target, skips by
      reason, calendar status, uptime and restarts.

  - id: OPS-004
    wp: WP09
    spec: "11"
    verify: unit
    status: implemented
    text: >-
      Telegram alerts are best-effort: sending never blocks or throws into
      trading logic; failures are retried later from a bounded queue; the bot
      token and chat id come only from parameters.

  - id: OPS-005
    wp: WP09
    spec: "11"
    verify: unit
    status: implemented
    text: >-
      Heartbeat. While the bot process is healthy it calls HeartbeatUrl every
      five minutes, in every state. A failed call is logged and never affects
      trading.

  - id: OPS-006
    wp: WP22
    spec: "11, 15.2"
    verify: unit
    status: implemented
    text: >-
      Inactivity warning. An alert is raised when 21 days have passed since
      the account's last opened trade, in every state, and again every 3
      days while it lasts. Changed on 2026-11-17 (owner acceptance): when
      the history shows no trade, the count starts at the later of the
      history start and 00:00 CE(S)T of RiskEpochDate, so a fresh account
      or a backtest is not warned before it has been without a trade for 21
      days. The server time of the last inactivity alert is stored through
      the key-value port, and after a restart no inactivity alert is raised
      within 3 days of it. A lost or unreadable stored value only removes
      this limit.

  - id: OPS-007
    wp: WP09
    spec: "10.2"
    verify: unit
    status: implemented
    text: >-
      Secrets never appear in logs, journal entries, alerts, exception
      messages or the repository. Journal and log writers mask the Telegram
      token and heartbeat URL.

  - id: OPS-008
    wp: WP22
    spec: "11"
    verify: unit
    status: implemented
    text: >-
      Repeat limits for the Log (owner acceptance of 2026-11-17), so that a
      lasting condition cannot fill the cTrader Log. (1) Recovery that keeps
      failing for missing or stale data: its recovery journal entry and its
      report line are written for the first failed run after a start, a
      reconnect or a completed recovery, then at most once per 24 hours of
      server time, each with the number of failed runs since the last
      written one; the run that completes is always written. The 15-minute
      retry is unchanged. (2) Errors: an error whose handler, exception type
      and message equal those of its group's last written error, written
      less than 60 minutes earlier, is counted for RSK-010 as before but is
      neither journaled nor alerted; the first such error 60 minutes or more
      after the group's last written line is journaled and alerted with the
      number left out since. Errors while the server time cannot be read are
      always written. (3) The risk-unavailable line is written when its text
      differs from the last one written or when 60 minutes have passed since
      that line; the last text is forgotten when entries are allowed again,
      so a new outage is always written (owner answer of 2026-11-17). The
      limits are fixed values, not parameters.
      No trading decision changes.

  - id: OPS-009
    wp: WP22
    spec: "11, 3.3"
    verify: unit
    status: implemented
    text: >-
      Zone outcome counts, journal only (owner acceptance of 2026-11-17).
      For bars fed live (not replayed) the bot counts per CE(S)T day the
      zones created and the zones that ended, by reason: signalled (a signal
      was emitted, whatever then happened to it), no FVG within
      ConfirmWindowBars after the touch, bias mismatch at the confirmation
      bar (SIG-018), invalid (close beyond distal), expired (MaxZoneAgeBars)
      and superseded (SIG-012). At the first live M15 bar of a later CE(S)T
      day it writes one line "zones day=<yyyy-MM-dd> created=N signalled=N
      no-fvg=N bias=N invalid=N expired=N superseded=N" for the counted day,
      unless every count is 0. Counts are not stored; a restart starts a new
      count. Zones, zone states and signals do not change.

  # ---------------------------------------------------------------- PLATFORM
  - id: PLT-001
    wp: WP01
    spec: "9.1"
    verify: build
    status: implemented
    text: >-
      ZoneFvg.Core references no cTrader assembly and performs no IO, network,
      clock, random or operating-system time-zone access. CI enforces this
      with tools/check_architecture.py.

  - id: PLT-002
    wp: WP08
    spec: "9.1"
    verify: manual
    status: planned
    text: >-
      ZoneFvg.Bot contains adapters only: it translates cTrader events and
      objects to core ports and back. It contains no trading rule, filter,
      risk calculation or state machine logic.

  - id: PLT-003
    wp: WP08
    spec: "10.3"
    verify: build
    status: implemented
    text: >-
      The cBot is declared with AccessRights.None and TimeZone UTC.

  - id: PLT-004
    wp: WP01
    spec: "10.3"
    verify: build
    status: implemented
    text: >-
      ZoneFvg.Core and ZoneFvg.Bot target net6.0 with C# language version 10.

  - id: PLT-005
    wp: WP22
    spec: "9.4"
    verify: manual
    status: planned
    text: >-
      Chart drawing is optional, controlled by DrawObjects, and every chart
      call is guarded so that a missing chart cannot throw. Added on
      2026-11-17 (owner acceptance): the painter remembers the names of the
      drawings it made in its previous paint and removes by name every
      remembered name it does not draw again, because cTrader does not list
      non-interactive drawings in the chart's object collection. A zone that
      ended or a gap that left the snapshot therefore disappears at the next
      paint. The remembered names are adapter drawing state only and no
      trading decision reads them.

