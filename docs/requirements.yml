  - id: SIM-008
    wp: WP40
    spec: "12.5, 12.1"
    verify: unit
    status: planned
    text: >-
      Drawdown brake in the simulator only (row AO; not a cBot setting).
      With the brake on, a trade opened while the closed balance is at
      least BrakeAtPercent (default 3.0) below the highest closed balance
      of the path (peak - balance >= BrakeAtPercent / 100 x peak, within
      1e-9 relative) risks BrakeFactor (default 0.5) times the plan's
      percent. Fixed sizing only: with --sizing ladder or recovery the
      options --brake-at and --brake-factor are refused with a message
      naming SIM-008. The options are accepted by the commands ftmo and
      accept and by the account replay of SIM-009; the brake is on exactly
      when --brake-at is given. Without it every result is the same as
      before, bit for bit. The report names the brake and its values.

  - id: SIM-009
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Account replay for monthly returns. One path from 00:00 CE(S)T of
      the first day of a given segment through every later trade of the
      combined list up to the segment's end, with the sizing and the bot
      limits of the challenge simulator (daily budget, kill switch,
      optional brake) and its FTMO floors, but without a profit target. A
      floor breach ends the path; a halt stops new trades. Output: per
      calendar month (CE(S)T date of the month's first and last day) the
      start and end balance and the return in percent, and the mean and
      median monthly return, share of positive months, worst month,
      maximum drawdown of the closed balance from its peak in percent,
      and the date and cause of a breach or halt. Available as the command
      sim replay with --from and --to dates.
