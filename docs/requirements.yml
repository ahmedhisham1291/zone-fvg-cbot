  - id: LAB-001
    wp: WP40
    spec: "12.5"
    verify: manual
    status: planned
    text: >-
      Data download (row AI). A Python 3 program under lab/data/ using only
      the standard library downloads, for EURUSD, GBPUSD, USDJPY, AUDUSD
      and XAUUSD and every day from 2019-03-01 to the end of the last
      complete month, Dukascopy's daily one-minute BID and ASK candle files
      (LZMA, 24-byte big-endian records: seconds from 00:00 UTC, four
      integer prices, a float volume; point 0.00001 for the pairs quoted in
      USD, 0.001 for USDJPY and XAUUSD; the URL layout and the price order
      are confirmed on the first real files and written in lab/data/README.md).
      At most 4 requests at a time, a generic User-Agent, 30 s timeout, up
      to 5 retries with back-off on errors, 429 and 5xx; 404 or an empty
      file is a day without data. Every record is checked (time a whole
      minute below 86,400 s and increasing, low <= min(open, close),
      high >= max(open, close), price within the symbol's plausible range:
      EURUSD 0.8-1.4, GBPUSD 1.0-1.8, AUDUSD 0.5-0.9, USDJPY 80-200,
      XAUUSD 1,000-10,000), and any failure stops the run naming file and
      record. A minute is written when both its bid and ask candles exist
      and the bid volume is above 0, and not between Friday 17:00 and
      Sunday 17:00 New York. Output per symbol and month: a gzip file with
      mtime 0 of the CSV header
      time_utc,bid_open,bid_high,bid_low,bid_close,ask_open,ask_high,ask_low,ask_close,volume,
      times yyyy-MM-ddTHH:mmZ, prices with the symbol's digits. A manifest
      lists per symbol and month the minutes kept, dropped by each rule,
      the weekdays without data (25 December and 1 January excepted), the
      first and last minute and the file's SHA-256, and per raw file its
      SHA-256; the data id is the SHA-256 of the manifest. A month with
      more than 2 weekdays without data fails the run. A month already in
      the cache with a matching checksum is not downloaded again. The
      Python unit tests run in the lab workflow without network access.

  - id: LAB-002
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Minute data reader (C#). Reads the monthly files of LAB-001 for one
      symbol and a time range, checks the header, every row (invariant
      culture, times whole minutes in UTC strictly increasing across
      months, bid and ask OHLC consistent as in LAB-001, ask close not
      below bid close) and the manifest checksum of each file, and refuses
      the whole input at the first problem with the file, row and column.
      Returns immutable minute records in time order.

  - id: LAB-003
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Bars from minutes. M15, H4 and D1 bars are built from the bid
      candles: M15 periods start on UTC quarter hours; D1 periods start at
      17:00 New York (NewYorkClock.TradingDayStartUtc of the trading date);
      H4 periods start at that time plus 0, 4, 8, 12, 16 and 20 hours. A
      bar's open time is its period start; open is the first kept minute's
      open, close the last kept minute's close, high and low the extremes.
      A period without a kept minute has no bar, and a period that is not
      complete at the end of the input has no bar. Across a change of New
      York summer time a D1 or H4 period has the length its two start
      times give.

  - id: LAB-004
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Simulated broker (rows AK). Implements IBroker from the minute
      candles. Buy orders and the exits of sell positions use the ask,
      sell orders and the exits of buy positions the bid. A limit fills
      when the minute reaches its price and fills at its price; a stop
      entry fills at the larger (buy) or smaller (sell) of its price and
      the minute's open, plus slippage. A stop loss fills at its price or,
      when the minute opens beyond it, at the open, minus slippage; a
      take profit fills at its price. When the stop loss and the take
      profit are both reached in one minute the stop loss is taken; in the
      minute of the fill only the stop loss is checked. Orders whose
      expiry is at or before the minute's start are removed before it is
      processed. History records carry commission (both sides), net
      profit, balance after close, volume, closing price and exit reason.
      Between minutes the current prices are the open of the minute being
      processed; while the market has no candle IsMarketOpen is false and
      orders and closes are refused with a reason. Symbol facts and
      sessions come from lab/symbols.json; requests that violate the
      symbol's volume or tick grid are refused as cTrader would.

  - id: LAB-005
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Costs (row AJ), from lab/costs.json: commission per side in USD per
      million USD of notional (pairs 30) or as a fraction of notional
      (gold 0.000007), converted with SymbolCostMath and reported to the
      core as RoundTripCommissionPerUnit; spread floor per symbol (EURUSD
      0.00003, GBPUSD 0.00006, AUDUSD 0.00004, USDJPY 0.005, XAUUSD 0.30),
      applied as ask = max(ask, bid + floor) for each of open, high, low
      and close, the floor being 3 times as large from 16:55 to 18:10 New
      York;
      slippage on stop entries and stop losses (pairs 0.00001, USDJPY
      0.001, XAUUSD 0.05). With stress, spread floor and commission are
      multiplied by 1.5 and slippage gets the extra of 12.1 step 6 (pairs
      0.00005, USDJPY 0.005, XAUUSD 0.15); the spread of the data is then
      also widened by 1.5. Swap is 0 unless the file gives it, and the run
      record says which.

  - id: LAB-006
    wp: WP40
    spec: "12.5"
    verify: scenario
    status: planned
    text: >-
      Replay through the bot's core. The lab constructs BotCore with
      isBacktest true, WriteTradeLog true and BacktestHaltsLogOnly true,
      runs StartChecks with the simulated account (balance = InitialCapital),
      calls OnStart with the history of every bar closed at the start
      time, then runs the minute clock of spec 12.5 (move time and expire,
      deliver closed bars in (close time, D1, H4, M15) order, OnTimer,
      resolve the minute, OnTradeEvent after each fill, close or expiry),
      every minute from start to end including closed-market minutes. IBarHistory
      serves the bars closed at the broker's time for recovery. At the end
      open positions are closed at the last price with reason EndOfRun and
      pending orders cancelled, followed by OnTradeEvent. The trade log is
      made from the journal with BacktestLogExtract and must read back with
      TradeLogCsv. Any exception the core lets out, or a journal error
      line counted by RSK-010, is reported in the run record; the run
      fails if the trade log cannot be extracted.

