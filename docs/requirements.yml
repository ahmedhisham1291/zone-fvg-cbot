  # ---------------------------------------------------------------- CHOCH ENTRY MODEL (spec v0.11, 3.9)
  - id: SIG-035
    wp: WP37
    spec: "3.9, 7"
    verify: unit
    status: implemented
    text: >-
      Entry model (owner's method of 2026-11-23). In ZoneFvg mode the entry
      trigger at a touched zone is chosen by EntryModel: Fvg (the default,
      spec 3.4 and 3.5 unchanged) or Choch (spec 3.9). The Choch parameters
      and their defaults are RequireSweep false, ChochWindowBars 32,
      ChochUseBias false, ChochStopAtDistal false, ChochTargetBufferAtr 0.1,
      ChochMinStopPips 5 and MinRewardRisk 2.0. They are checked at start in
      every mode: ChochWindowBars a whole number from 4 to 96;
      ChochTargetBufferAtr finite and from 0 to 1; ChochMinStopPips finite
      and greater than 0; MinRewardRisk finite and from 1 to 10. EntryModel
      Choch together with EntryMode Breakout or SessionRange is refused at
      start (fail closed: the default EntryMode is Breakout, and an instance
      must not run another rule than the one its owner chose). A refusal
      names the parameter as cTrader shows it, its rule and the rejected
      value. With EntryModel Fvg every signal, journal line, skip and
      parameter hash stays bit for bit what it was.

  - id: SIG-036
    wp: WP37
    spec: "3.2, 3.3, 3.9"
    verify: unit
    status: implemented
    text: >-
      Zones of the Choch model. Zones are detected, superseded, activated,
      touched, invalidated and expired exactly as SIG-006 to SIG-015 say,
      with the same parameters. The confirmation window of a Touched zone is
      ChochWindowBars M15 bars instead of ConfirmWindowBars: the touch bar is
      bar 0 and the window ends after bar ChochWindowBars. No fair value gap
      is searched. A zone produces at most one signal (SIG-018). With
      ChochUseBias false the zone type alone gives the side (demand: buy,
      supply: sell) and the bias is not read; with ChochUseBias true a CHoCH
      at a zone whose type does not match the bias makes the zone Used
      without a signal, as SIG-018.

  - id: SIG-037
    wp: WP37
    spec: "3.9"
    verify: unit
    status: implemented
    text: >-
      Change of character (demand zone, buy). M15 swings are the swings of
      SIG-006 found on the M15 bars with the same SwingStrength and the same
      100-bar lookback (SwingDetector). At the close of an M15 bar c1 that
      lies in the window of a Touched demand zone (bars 0 to
      ChochWindowBars), let H be the most recent confirmed M15 swing high
      (latest bar open time) in the swings found on the M15 bars up to and
      including c1. c1 confirms a change of character when such an H exists,
      no M15 bar after H's bar and before c1 closed above H's price, and
      close(c1) is above H's price; above is strict and uses PriceMath with
      its default tolerance. When the most recent swing high was already
      closed above, nothing confirms at c1 (no older swing is tried). The
      first confirming bar of the window is used. When the window ends
      without a confirmation the zone becomes Used (zone end reason NoChoch).
      Supply zones (sell) mirror this with swing lows and closes below. With
      ATR(M15) or ATR(H4) missing, not finite or not greater than zero,
      nothing confirms at c1 (fail closed) and the window goes on.

  - id: SIG-038
    wp: WP37
    spec: "3.9"
    verify: unit
    status: implemented
    text: >-
      Sweep (demand zone, buy). A bar b sweeps when its low is strictly below
      the price of the most recent confirmed M15 swing low found on the M15
      bars up to and including b. The setup has a sweep when at least one
      bar from the touch bar to c1, both included, sweeps. With RequireSweep
      true a change of character without a sweep confirms nothing at c1 and
      the window goes on; with RequireSweep false (the default) the sweep is
      not required and is only reported in the signal (Swept yes or no).
      Supply zones mirror this with swing highs and highs strictly above.

  - id: SIG-039
    wp: WP37
    spec: "3.9"
    verify: unit
    status: implemented
    text: >-
      Choch entry and stop (buy). Entry = H's price, the broken swing level,
      as a buy limit order. Stop = X - StopBufferAtr x ATR(M15), where X is
      the lowest low of the M15 bars from the touch bar to c1, both included;
      with ChochStopAtDistal true X is the lower of that low and the zone's
      distal line. ATR(M15) and ATR(H4) are the latest values at the close
      of c1. Sell mirrors this (entry at the swing low's price, X the highest
      high, the higher of it and the distal line). The signal carries the
      zone id, side, entry, stop, target (SIG-040), Level (= entry), Swept,
      the target's source, the close time of c1 and the ATR(H4) used.

  - id: SIG-040
    wp: WP37
    spec: "3.9"
    verify: unit
    status: implemented
    text: >-
      Choch target (buy). The opposing levels are the proximal lines of the
      non-terminal supply zones in the book and the prices of the confirmed
      H4 swing highs of SIG-006 that no later H4 bar has closed above (a
      broken high is no longer resistance; decision of 2026-11-23), each only
      when strictly above the entry (PriceMath). The target is the lowest opposing level minus
      ChochTargetBufferAtr x ATR(H4); its source is "zone:<id>" or
      "swing:<yyyyMMdd-HHmm of the swing bar>", and when a zone proximal and
      a swing price are equal the zone is the source. Without any opposing
      level the target is entry + RewardRisk x (entry - stop), source
      "default". The target is computed whatever reward it gives; whether it
      is enough is the execution layer's check (EXE-028). Sell mirrors this
      with demand zones, H4 swing lows not closed below by a later H4 bar,
      the highest level below the entry and the buffer added.

  - id: SIG-041
    wp: WP37
    spec: "3.3, 3.9, 9.4"
    verify: unit
    status: implemented
    text: >-
      Choch in the signal engine. With EntryModel Choch the engine runs the
      zone book of SIG-036 and the rules of SIG-037 to SIG-040 at each M15
      close, Touched zones in id order, and returns each result as a Signal
      of Kind Choch with the zone id in ZoneId, no Fvg and the replay flag.
      SIG-001, SIG-003, SIG-004, SIG-005 and SIG-020 apply unchanged; the
      warm-up also covers the 100-bar M15 swing lookback plus
      ChochWindowBars. Determinism (as SIG-002), replay equals live (as
      SIG-019: the same zones, touch data and signals after T) and mirror
      symmetry (as SIG-021, Swept and the target source included) hold in
      this model. A change of character found while the engine is not ready
      consumes the zone and returns no signal, as in the Fvg model.

  - id: SIG-042
    wp: WP42
    spec: "3.8, 7"
    verify: unit
    status: implemented
    text: >-
      Direction of SessionRange from two D1 EMAs (owner request of
      2026-11-27, row AY). SessionRangeParameters gain RangeTrendFastEma
      (core default 0 = off: the setup's side comes from the bias of 3.1 as
