  - id: SIG-043
    wp: WP43
    spec: "3.10, 7"
    verify: unit
    status: planned
    text: >-
      Overnight signal (owner request of 2026-11-27, rows AZ and BE). A
      tracker in the core, fed closed M15 bars and the last closed D1 and
      M15 ATRs, gives at most one buy setup per trading day (3.8's trading
