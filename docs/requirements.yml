      and combination number.

  - id: LAB-010
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Measures, per symbol and pooled over a set of symbols, for trades
      whose open time is inside the segment: trades, trades per month
      (months of the segment), win rate (result_r > 0), average R, profit
      factor (sum of positive R / absolute sum of negative R; reported as
      infinite without a loss), maximum drawdown in R (cumulative R by
      close time from its running peak, starting at 0), worst losing run
      (most consecutive trades with result_r <= 0 by close time), R per
      calendar month (UTC month of the close), share of positive months
      (months of the segment without a trade count as not positive), and
      R per calendar year.

  - id: LAB-011
    wp: WP40
    spec: "12.5"
    verify: unit
    status: planned
    text: >-
      Selection rule LAB-SEL-1 (proposal), on development trades only:
      symbol s counts for combination c with at least 30 trades and a
      profit factor of at least 1.10; c is eligible with at least 2
      counting symbols, at least 150 trades pooled over them, pooled
      profit factor at least 1.20, pooled average at least +0.10R and
      pooled R above 0 in at least 3 of the years 2020 to 2024; score =
      pooled R per month / max(pooled maximum drawdown in R, 1);
      neighbours of c are the combinations of its block that differ in
      exactly one key by one position in that key's list (boolean lists
      too); c is on a plateau when it has no neighbour or the median of its
      neighbours' scores (each computed the same way, eligible or not, 0
      for a neighbour without counting symbols) is at least half its own;
      the eligible combination on a plateau with the highest score is
      chosen, ties by the lower number. Without one the result is "No
      combination passes on the development data". The output names every
      combination's eligibility with the failed marks.

  - id: LAB-012
    wp: WP40
    spec: "12.5, 12.1"
    verify: unit
    status: planned
    text: >-
